[tool.poetry]
name = "alpha-agent"
version = "0.1.0"
description = "ALPHA – Autonomous Least-Privilege Hardening Agent"
authors = ["TODO <team@example.com>"]
readme = "README.md"
packages = [{ include = "alpha_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.42.17"
botocore = "^1.42.17"
tenacity = "^9.1.2"
requests = "^2.32.4"
pydantic = "^2.12.5"

[tool.poetry.group.dev.dependencies]
moto = "^5.1.19"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
diagrams = "^0.24.4"

[tool.poetry.scripts]
alpha = "alpha_agent.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[project]
name = "alpha-agent"
version = "0.1.0"
description = "ALPHA – Autonomous Least-Privilege Hardening Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TODO", email = "team@example.com" }]
dependencies = [
  "boto3>=1.42.17,<2.0.0",
  "botocore>=1.42.17,<2.0.0",
  "tenacity>=9.1.2,<10.0.0",
  "requests>=2.32.4,<3.0.0",
  "pydantic>=2.12.5,<3.0.0",
]
packages = [{include = "alpha_agent", from = "src"}]

[project.optional-dependencies]
dev = [
  "moto>=5.1.19,<6.0.0",
  "pytest>=8.3.3,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "diagrams>=0.24.4,<1.0.0",
]
