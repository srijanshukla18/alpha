name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: UV_CACHE_DIR=.uv-cache uv sync --all-extras
      - name: Run tests
        run: UV_CACHE_DIR=.uv-cache uv run pytest tests
